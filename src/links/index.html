<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThirtyOne Lab | Link Tree</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/Image/Favicon/Favicon Web.webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --boutique-red: #C51B27;
            --thirtyone-black: #111111;
            --warm-sand: #FAF9F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--warm-sand);
            color: var(--thirtyone-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('../Image/Favicon/bg_linktree.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Overlay to ensure text readability if background is busy */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(250, 249, 246, 0.9); /* Warm Sand overlay */
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--boutique-red); /* Logo background as requested */
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo-container img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }
        
        /* Placeholder text for logo */
        .logo-placeholder-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: white;
            font-size: 24px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .title-black {
            color: var(--thirtyone-black);
        }

        .title-red {
            color: var(--boutique-red);
        }

        .reg-mark {
            font-size: 0.5em;
            vertical-align: super;
        }

        p.subtitle {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            color: #555;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--thirtyone-black);
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .link-card:hover {
            border-color: var(--boutique-red);
            color: var(--boutique-red);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(197, 27, 39, 0.15);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .link-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .link-text {
            flex-grow: 1;
            text-align: center;
            padding-right: 40px; /* Balance out the icon width to keep text centered */
        }

        footer {
            margin-top: auto;
            padding: 40px 0 20px;
            font-size: 13px;
            color: #888;
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
        }

        footer p {
            margin-bottom: 4px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="container">
        <!-- Logo -->
        <div class="logo-container animate-fade-in">
            <img src="../Image/Favicon/Logo_31_White.webp" alt="ThirtyOne Lab Logo">
        </div>

        <!-- Title & Subtitle -->
        <h1 class="animate-fade-in"><span class="title-black">THIRTYONE</span><span class="title-red">LAB</span><span class="reg-mark title-red">®</span></h1>
        <p class="subtitle animate-fade-in">WEAR WITH PRIDE</p>

        <!-- Links -->
        <div class="links-container">
            
            <a href="https://31lab.pages.dev" class="link-card animate-fade-in delay-1" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">
                    <img src="../Image/Favicon/Logo Favicon.webp" alt="Website">
                </div>
                <span class="link-text">Website Catalog</span>
            </a>

            <a href="https://wa.me/601125614436" class="link-card animate-fade-in delay-2" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">
                    <img src="../Image/Favicon/Favicon WhatsApp.webp" alt="WhatsApp">
                </div>
                <span class="link-text">Order via WhatsApp</span>
            </a>

            <a href="https://www.instagram.com/thirtyonelab" class="link-card animate-fade-in delay-3" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">
                    <img src="../Image/Favicon/Favicon IG.webp" alt="Instagram">
                </div>
                <span class="link-text">Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@thirtyonelabofficial" class="link-card animate-fade-in delay-4" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">
                    <img src="../Image/Favicon/Favicon Tiktok.webp" alt="TikTok">
                </div>
                <span class="link-text">TikTok</span>
            </a>

            <a href="https://www.facebook.com/thirtyonelab" class="link-card animate-fade-in delay-5" target="_blank" rel="noopener noreferrer">
                <div class="link-icon">
                    <img src="../Image/Favicon/Favicon FB.webp" alt="Facebook">
                </div>
                <span class="link-text">Facebook</span>
            </a>

        </div>
    </div>

    <footer>
        <p>Copyright &copy; 2026 ThirtyOne Lab. All Rights Reserved.</p>
        <p>Developed by @amnhmb</p>
    </footer>
</body>
</html>
